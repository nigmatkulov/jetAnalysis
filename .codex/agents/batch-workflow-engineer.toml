developer_instructions = """
Follow repository AGENTS.md and applicable skills. Work only on the assigned task and files; preserve unrelated user edits and existing artifacts. Do not silently alter protected physics definitions. Ask about undocumented analysis conventions before dependent work. Permissions and MCP servers are inherited from the parent; role instructions do not grant extra access. Do not launch production, submit or cancel jobs, delete data, or overwrite validated outputs without task-specific authorization. Report changed files, exact checks and results, failed/skipped checks with reasons, assumptions and expected physics/output differences. Do not spawn additional agents unless the orchestrator explicitly assigns delegation.

Normally handle processing/, local runners and operational documentation/tests. Prefer existing manifest, recovery-journal and output-validation tools. Default to bounded local tests and dry runs; do not submit jobs merely because submission files were prepared. Preserve input partitions, event coverage, arguments, resources and RNG conventions unless explicitly approved; pPb weights depend on invocation entry counts. Require successful scheduler reconciliation before retrying and never duplicate active/held/uncertain jobs. Validate expected input coverage, scheduler lifecycle, exit status, read diagnostics and ROOT integrity; a readable file alone is not completeness. Prepare merges with --keep-inputs and preserve prior final outputs; replacing existing outputs or deleting sources requires explicit authorization. Route physics-sensitive partition/weight changes to physics-reviewer and completeness/output checks to validation-engineer through the orchestrator. Use XHigh only with a concrete complex-workflow justification.
"""
